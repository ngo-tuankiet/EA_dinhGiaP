# Định nghĩa kịch bản Bull / Base / Bear — NGUỒN DUY NHẤT (D30).
#
# Trước D30 có HAI bản sao logic kịch bản trong cùng file sensitivity.py với
# NGƯỠNG KHÁC NHAU: `apply_scenario_adjustments` (bank Bull cap credit growth
# 0,40; Bear floor -0,05) và `run_scenario_analysis` (cap 0,30; floor +0,02).
# Tuỳ đường gọi mà ra kết quả khác nhau cho cùng một mã, cùng một kịch bản.
#
# Quan trọng hơn: CẢ HAI đều chỉ nhiễu credit_growth/NIM, KHÔNG đụng tới COE,
# tăng trưởng vĩnh viễn g, hay ROE bền vững — trong khi giá trị terminal mới là
# nơi chứa gần hết bất định. Hệ quả: dải Bull-Bear của ACB chỉ ±6% (37,4k-42,0k)
# quanh 39,5k, tạo cảm giác an toàn giả.

version: 2

# Trọng số xác suất để ra giá trị kỳ vọng (tổng phải = 1, sensitivity.py assert).
weights:
  Bull: 0.25
  Base: 0.50
  Bear: 0.25

Bull:
  # Chi phí vốn giảm khi môi trường lãi suất/rủi ro thuận lợi.
  coe_delta: -0.01
  rf_delta: -0.01
  terminal_g_delta: 0.005
  bank:
    credit_growth_mult: 1.2
    credit_growth_cap: 0.40
    deposit_growth_mult: 1.2
    deposit_growth_cap: 0.40
    nim_mult: 1.1
    nim_cap: 0.06
    cir_mult: 0.9
    cir_floor: 0.15
    # D67: không còn sustainable_roe_delta — ROE bền vững NH của kịch bản tính lại từ driver đã sốc
    # (sensitivity.apply_scenario_adjustments), ROE ngành không sốc.
    credit_cost_mult: 0.9
  nonfin:
    # Sốc CỘNG cho tăng trưởng: sốc nhân ×1,2 làm Bull = Base khi g = 0 và làm
    # tăng trưởng âm tệ hơn trong Bull.
    revenue_growth_delta: 0.03
    revenue_growth_cap: 0.50
    ebit_margin_mult: 1.2
    ebit_margin_cap: 0.60

Bear:
  coe_delta: 0.01
  rf_delta: 0.01
  terminal_g_delta: -0.005
  bank:
    credit_growth_mult: 0.8
    credit_growth_floor: -0.05
    deposit_growth_mult: 0.8
    deposit_growth_floor: -0.05
    nim_mult: 0.9
    nim_floor: 0.01
    cir_mult: 1.1
    cir_cap: 0.70
    credit_cost_mult: 1.5           # rủi ro chính của NH VN: chi phí tín dụng tăng
  nonfin:
    revenue_growth_delta: -0.03
    revenue_growth_floor: -0.20
    ebit_margin_mult: 0.8
    ebit_margin_floor: 0.01
