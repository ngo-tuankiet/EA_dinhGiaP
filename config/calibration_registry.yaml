# Sổ đăng ký hiệu chuẩn từng mã VN100 (D25).
#
# ĐÂY LÀ CƠ CHẾ "GIỮ NGUYÊN HAY PHẢI SỬA" cho từng công ty.
#
# Nguyên tắc (quyết định #1): mô hình ĐƯỢC PHÉP lệch khỏi đồng thuận CTCK — CTCK
# cũng sai, cũng có thiên lệch lạc quan. Nhưng mỗi lần lệch phải GIẢI TRÌNH ĐƯỢC
# bằng luận điểm cụ thể, có bằng chứng. Lệch mà không giải trình được ⇒ coi là
# lỗi giả định và phải sửa.
#
# BA TRẠNG THÁI:
#   out_of_band_justified — lệch CÓ CHỦ Ý, ta tin mình đúng hơn CTCK.
#                           BẮT BUỘC có thesis + evidence + reviewed_on.
#   out_of_band_must_fix  — thừa nhận là LỖI, nằm trong backlog sửa.
#   data_blocked          — không đủ dữ liệu để kết luận (không phải lỗi mô hình).
#
# Luận điểm CÓ HẠN `review_ttl_days`: hết hạn thành STALE_JUSTIFICATION và phải
# rà lại. "Đã giải thích một lần" không cấp quyền miễn nhiễm vĩnh viễn.
#
# Sửa file này là một commit được review bình thường.

version: 1

default_band: 0.20

# Phương pháp proxy (dựa giá trị sổ sách/quỹ đất) có sai số bản chất lớn hơn DCF.
# Ép chúng vào ±20% chỉ tạo ra hàng loạt "vi phạm" giả.
bands_by_method:
  SOTP: 0.35
  RNAV: 0.30

review_ttl_days: 180

tickers:

  # =========================================================================
  # NHÓM 1 — LỖI ĐÃ XÁC ĐỊNH, ĐANG TRONG BACKLOG SỬA
  # =========================================================================
  # Bằng chứng chung: FV thấp hơn CHÍNH THỊ GIÁ 56-92% — sai số này không thể
  # giải thích bằng "quan điểm thận trọng", đó là lỗi phương pháp.
  # Xem D23 (bảng baseline) và kế hoạch GĐ3/GĐ4.

  # --- Nhóm PB/chứng khoán: ĐÃ SỬA ở D26, phần lệch còn lại là bất đồng quan điểm ---
  # (luận điểm D26 phi duyệt cho VCI/HCM/SSI. r3b 20/10/2026: SSI/HCM tách ra must_fix bên dưới vì cơ chế
  # P/B mới của fx2 mục 9 / r3a mục 5 chưa được duyệt; VCI giữ luận điểm — đang bị chặn nên không đo.)
  # r4a (20/10/2026): VCI mở công bố lại khi ngưỡng hai chân 3,0 → 5,0 — −50,7% (n=1, CTCK 31.200đ) ở cả hai mốc
  # (FV 15.388đ, P/B riêng pro-forma 1,63x); luận điểm D26 (owner phi) giữ nguyên, không đổi trạng thái thay phi.
  # SỬA NHẬN ĐỊNH (phản biện r3): mức giảm FV của VIX (−15%, r3a mục 5) và phần lệch thêm của SSI là do ĐỔI PHƯƠNG
  # PHÁP (P/B lịch sử riêng post-money thay trung vị nhóm: VIX 1,14x vs 1,58x; SSI 1,57x vs 1,66x), KHÔNG phải sai
  # số xấp xỉ công thức pro-forma. P/B post-money TERP chính xác: VIX trung vị 1,18x (gần 1,14x engine); SSI FY2022–
  # 2025 1,04/1,64/1,61/2,07x vs pro-forma 0,83/1,57/1,54/1,90x (trung vị 4 năm 1,63x vs 1,55x). Duyệt TERP sẽ không
  # phục hồi FV VIX; câu hỏi cho phi là chọn P/B riêng post-money hay trung vị nhóm.
  VCI: &ck_thesis
    status: out_of_band_justified
    thesis: >-
      D26 đã sửa 3 lỗi thật: (1) ROE lệch tử/mẫu số (lấy LNST trước tăng vốn chia
      VCSH sau tăng vốn), (2) perpetuity một nhịp không có giai đoạn dự phóng,
      (3) dùng chung model với bảo hiểm dù kinh tế khác hẳn. Phần lệch CÒN LẠI là
      bất đồng quan điểm có cơ sở: mô hình dùng ROE mid-cycle của chính công ty
      (8,9%-13,1% cho 7 CTCK), trong khi giá mục tiêu CTCK ngụ ý ROE 22%-30% —
      CAO HƠN CẢ ĐỈNH chu kỳ 2021 (SSI 22%, VCI 27%). Đó là kịch bản nâng hạng
      thị trường mới nổi; mô hình không đưa vào vì chưa xảy ra.
      CÂU HỎI MỞ (chưa xử lý, không phải lý do bào chữa): COE 13,4%-15,2% có thể
      hơi cao — công thức đang lấy rf theo TPCP VND rồi cộng NGUYÊN phần bù rủi ro
      quốc gia dựng theo khung USD của Damodaran (mature 4,5% + CRP VN 3,7%), có
      dấu hiệu tính trùng rủi ro quốc gia. Cần rà riêng ở một giai đoạn khác vì
      COE ảnh hưởng TOÀN BỘ 97 mã, không được sửa lẻ trong phạm vi nhóm CK.
    evidence:
      - "DECISIONS.md#D26"
      - "ROE mid-cycle thực đo 7 CTCK: 8,9%-13,1% (median 11,1%)"
      - "P/B ngụ ý từ giá mục tiêu CTCK: SSI 2,34x, VCI 2,09x, HCM 1,69x"
      - "ROE ngụ ý tương ứng: 30,0% / 26,2% / 21,9% — vượt đỉnh 2021"
    owner: phi
    reviewed_on: 2026-08-11
    decision_ref: D26
  SSI:
    status: out_of_band_must_fix
    thesis: >-
      Luận điểm D26 (ROE mid-cycle vs ROE 22–30% ngụ ý trong giá mục tiêu) phi duyệt ở mức −34,7%. Phần lệch
      thêm do cơ chế P/B lịch sử CHƯA được duyệt: fx2 mục 9 loại quan sát trước đợt quyền mua 20% (trung vị
      nhóm 1,66x thay 2,08x riêng, −44,2%), r3a mục 5 thay bằng pro-forma P/B = vốn hoá/(VCSH + tiền thu C)
      (1,57x riêng, 4 quan sát pro-forma). Số đo r3b: −45,7% ở cả 28/09 và 20/10 (n=3), FV 16.238đ vs thị giá
      19.800đ. Giữ must_fix (không justified) tới khi phi duyệt phương pháp P/B pro-forma/loại quan sát.
    evidence: ["DECISIONS.md#D26", "upgrade_notes/fx2_models.md", "upgrade_notes/r3a_models.md",
               "upgrade_notes/r3b_audit_registry.md"]
    owner: "claude-de-xuat (cho phi duyet)"
    reviewed_on: 2026-10-20
    decision_ref: D26
  HCM:
    status: out_of_band_must_fix
    thesis: >-
      Luận điểm D26 phi duyệt ở mức lệch cũ; nay −52,1% (28/09) / −52,7% (20/10), n=1, FV 13.715đ vs thị giá
      24.200đ. Chân P/B rơi về trung vị nhóm (1,46x) vì fx2 mục 9 loại mọi quan sát trước đợt quyền mua 25%
      (GDKHQ 16/07, hoàn tất 23/10/2026 — chưa có quý BCTC để ước tiền thu C cho pro-forma r3a). Cơ chế này
      chưa được phi duyệt → must_fix; một CTCK cũng chưa đủ làm mốc.
    evidence: ["DECISIONS.md#D26", "upgrade_notes/fx2_models.md", "upgrade_notes/r3a_models.md",
               "upgrade_notes/fx4_verify.md", "upgrade_notes/r3b_audit_registry.md"]
    owner: "claude-de-xuat (cho phi duyet)"
    reviewed_on: 2026-10-20
    decision_ref: D26
  # fx2 (20/10/2026, claude-de-xuat chờ phi duyệt): chân P/B lịch sử nhóm CK loại quan sát trước đợt quyền
  # mua/riêng lẻ (relative_multiples.capital_raise_exclusion_groups). SSI (quyền mua 20%, niêm yết 25/02/2026)
  # còn 1 quan sát sạch → trung vị P/B nhóm 1,66x thay 2,08x: −34,7% → −44,2% (28/09, n=3); VCI bị chặn
  # (RI 6.162 vs P/B 23.618, 3,8x > leg_ratio_review); HCM −52,5% (n=1). Luận điểm ROE mid-cycle ở trên giữ
  # nguyên; phần lệch thêm của SSI là chân P/B nhóm thấp hơn P/B riêng — rà lại khi có giá phát hành để
  # pro-forma thay vì bỏ quan sát.

  # --- Nhóm SOTP: proxy sổ sách vô nghĩa với holding (sẽ sửa ở GĐ4) ---
  # MSN: ĐÃ GỠ 20/10/2026 (s5) — proxy thay bằng SOTP_HOLDINGS (MCH, TCB theo thị giá): −0,8% (19/10) /
  # −0,9% (28/09, mô phỏng đã điền reviewed_by) so với CTCK n=6. THÊM LẠI 20/10/2026 (r4b) sau quyết định phi Q4
  # (MSR, MML theo thị giá) — xem mục MSN bên dưới.
  # r4b (20/10/2026): audit nguồn công ty con (GEL, VSH, TBC, TMP, HHS, MSR, MML) xong → hết
  # SOTP_SUBSIDIARY_DATA_ERROR; GEX/REE/TCH/MSN chỉ còn chặn SOTP_HOLDINGS_UNVERIFIED (chờ người dùng điền
  # reviewed_by). Ba mục dưới chưa được đo bởi golden (FV chưa công bố) và dùng ngay khi mở. GEX trong band
  # (−8,1% n=1 / +8,3% n=2) → không khai báo.
  # TCH: gỡ D71 (23/10/2026) — công bố qua BROKER_SYNTH nhiều CTCK, vào band; mục cũ lỗi thời.
  # REE: bỏ khỏi registry trước đây (proxy −27,6% trong band SOTP 0,35). THÊM LẠI 20/10/2026 (r4b): chế độ
  # SOTP_HOLDINGS (s7) cho −40,5% ở cả hai mốc.
  # REE: gỡ D71 (23/10/2026) — công bố qua BROKER_SYNTH nhiều CTCK, vào band; mục cũ lỗi thời.
  # D68 (22/10/2026): MSN chuyển sang BROKER_SYNTH (mô hình tổng hợp CTCK Mirae Asset 30/09/2026) — vào band
  # cả hai mốc (28/09 −7,0%, 20/10 −8,1%). Mục SOTP_HOLDINGS cũ (chờ phi rà MSR/MML) đã gỡ, OBSOLETE_ENTRY.
    reviewed_on: 2026-10-20
    decision_ref: D65
  # VIC không có đồng thuận CTCK trong 180 ngày -> không đo được, không khai báo.

  # --- Ngân hàng: D29 đã sửa overshoot của D20 ---
  # ĐÃ GỠ khỏi registry (harness báo OBSOLETE_ENTRY sau D29): ACB (+44,3%→+18,1%),
  # VIB (+42,4%→+8,8%), OCB (+55,1%→+19,7%), BID (-21,4%→-5,7%) — đều đã vào band.
  # ĐÃ GỠ 19/10/2026 (gói NH s3: ROE terminal hội tụ ROE ngành λ=1, chi phí tín dụng phai đối xứng,
  # tăng trưởng tín dụng phai về GDP danh nghĩa) — vào band ở cả mốc golden 28/09 lẫn 19/10:
  # MBB (+27% → +9,7% / +10,8%), STB (−27% → −17,3% / −19,8%), CTG, VPB (xem nhóm must_fix bên dưới).
  # TPB: ĐÃ GỠ 02/10/2026 — sau D47 lệch +0,3% (trong band). Ra band lại ở mốc 28/09 (nhóm 3), ĐÃ GỠ lần 2
  # 20/10/2026 (fx1, xem dưới).
  # HDB, TPB: ĐÃ GỠ 20/10/2026 (fx1 mục 8) — lệch ở mốc golden 28/09 là lookahead lệch gốc: giá prices_daily
  # đã điều chỉnh lùi theo cổ tức CP/thưởng có GDKHQ SAU 28/09 nhưng số cp lấy tại 28/09. Nay
  # repo.get_shares_outstanding_repo quy số cp as_of về gốc giá (× (1 + Σ tỷ lệ cùng ngày)):
  # HDB 5.005,28 → 6.506,86 tr cp (25% + 5%, GDKHQ 09/10), +33,0% → +11,2% (28/09, n=10), +8,4% (20/10, n=8);
  # TPB 2.774,05 → 3.190,15 tr cp (15%, GDKHQ 02/10), +29,0% → +17,6% (28/09, n=2), +16,9% (20/10, n=3).
  # Cả hai trong band ở hai mốc. Đề xuất claude-de-xuat (cho phi duyet).
