# Cổ phần công ty con/liên kết ĐANG NIÊM YẾT của các tập đoàn định giá SOTP (chế độ SOTP_HOLDINGS).
#
# Công thức (valuation/engine/models/sotp.py, Damodaran "cross holdings"):
#   FV/cp = [VCSH mẹ hợp nhất + Σ (stake × vốn hóa − giá sổ phần sở hữu)] / số cp × (1 − chiết khấu holding)
#   giá sổ phần sở hữu = carrying_value_bn nếu khai (khoản đầu tư ghi giá gốc), không thì stake × VCSH mẹ
#   của công ty con (phần đã nằm trong số hợp nhất). Phần chưa niêm yết giữ theo sổ sách hợp nhất.
# DB chỉ có BCTC hợp nhất → không có nợ ròng cấp công ty mẹ; công thức trên là dạng tương đương.
#
# stake = LỢI ÍCH KINH TẾ hiệu quả (trực tiếp + gián tiếp), KHÔNG phải tỷ lệ pháp lý của pháp nhân
# trung gian. Mỗi holding bắt buộc có `source` (https://) — không bịa tỷ lệ (AGENTS luật vàng #1).
#
# CỔNG CÔNG BỐ: `reviewed_by` trống → SOTP_HOLDINGS_UNVERIFIED (chặn). `as_of` (ngày người dùng
# đối chiếu xong) cũ hơn review_ttl_days → SOTP_HOLDINGS_STALE (chặn). Số liệu dưới đây do agent
# chẩn đoán tìm ngày 19/10/2026 (REE, TCH, GEL thêm 20/10/2026 sau khi ingest giá công ty con ngoài VN100;
# MSR, MML thêm 20/10/2026 theo quyết định phi Q4);
# người dùng đối chiếu BCTN 2025 / thuyết minh BCTC Q2/2026 rồi mới điền.
# Lưu ý: một mã nắm cổ phần (holding ticker) không được đồng thời là holder (chống đệ quy).

